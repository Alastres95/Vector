
name: Compilar Vértice Telecom

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar web
        run: pnpm --filter @workspace/vertice-telecom build
        env:
          PORT: 5000
          BASE_PATH: /

      - name: Guardar archivos preparados
        uses: actions/upload-artifact@v4
        with:
          name: vertice-telecom-web
          path: artifacts/vertice-telecom/dist/public/
          if-no-files-found: error
